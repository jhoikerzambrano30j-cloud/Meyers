<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1A1A1A">
    <title>Crear cuenta | Meyer's Inmobiliaria</title>
    <meta name="robots" content="noindex">

    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Meyer's">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app.css">
</head>
<body>

    <a href="index.html" class="auth-back"><i class="fas fa-arrow-left"></i> Volver al inicio</a>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="img/logo-meyer.png" alt="Meyer's Inmobiliaria">
            </div>
            <h1>Crea tu cuenta</h1>
            <p class="auth-sub">Guarda tus propiedades favoritas</p>

            <div class="alert" id="alert"></div>

            <form id="registroForm">
                <div class="form-group">
                    <label for="fullName">Nombre completo</label>
                    <input type="text" id="fullName" required autocomplete="name" placeholder="Tu nombre y apellido">
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required autocomplete="email" placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label for="email2">Repite el correo</label>
                    <input type="email" id="email2" required autocomplete="off" placeholder="Escríbelo otra vez">
                    <small class="field-hint">Escríbelo de nuevo para evitar errores. No se permite copiar ni pegar.</small>
                </div>
                <div class="form-group">
                    <label for="phone">Teléfono / WhatsApp</label>
                    <input type="tel" id="phone" required autocomplete="tel" placeholder="0414-1338254">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label for="password2">Repite la contraseña</label>
                    <input type="password" id="password2" required minlength="6" autocomplete="new-password" placeholder="Repite tu contraseña">
                </div>
                <div class="captcha-box" id="captchaBox"></div>
                <button type="submit" class="btn btn-primary btn-block">Crear cuenta</button>
            </form>

            <p class="auth-foot">
                ¿Ya tienes cuenta? <a href="login.html">Ingresar</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="auth.js"></script>
    <script src="captcha.js"></script>
    <script>
        const alertBox = document.getElementById('alert');
        const show = (msg, tipo) => {
            alertBox.textContent = msg;
            alertBox.className = 'alert show ' + (tipo === 'error' ? 'alert-error' : 'alert-success');
        };

        document.addEventListener('DOMContentLoaded', () => {
            if (!window.isSupabaseReady()) {
                show('Supabase aún no está configurado. Pega tus claves en config.js.', 'error');
            }

            // Captcha anti-robots (solo aparece si Cloudflare lo pide)
            if (window.Captcha) Captcha.render('#captchaBox');

            // Bloquear copiar / pegar en correo y contraseña (para evitar errores)
            const sinCopiarPegar = ['email', 'email2', 'password', 'password2'];
            sinCopiarPegar.forEach((id) => {
                const el = document.getElementById(id);
                if (!el) return;
                ['paste', 'copy', 'cut', 'drop'].forEach((evt) =>
                    el.addEventListener(evt, (e) => e.preventDefault()));
            });

            const form = document.getElementById('registroForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value.trim().toLowerCase();
                const email2 = document.getElementById('email2').value.trim().toLowerCase();
                if (email !== email2) { show('Los correos no coinciden. Revísalos por favor.', 'error'); return; }

                const password = document.getElementById('password').value;
                const password2 = document.getElementById('password2').value;
                if (password !== password2) { show('Las contraseñas no coinciden.', 'error'); return; }
                if (password.length < 6) { show('La contraseña debe tener al menos 6 caracteres.', 'error'); return; }

                const btn = form.querySelector('button[type="submit"]');
                const original = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';

                // Verificación anti-robots (Cloudflare Turnstile)
                const captchaToken = await Captcha.waitForToken(10000);
                if (Captcha.activo && !captchaToken) {
                    btn.disabled = false;
                    btn.innerHTML = original;
                    show('No pudimos verificar que no eres un robot. Inténtalo de nuevo.', 'error');
                    Captcha.reset();
                    return;
                }

                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creando cuenta...';

                const { data, error } = await Auth.signUp({
                    email,
                    password,
                    fullName: document.getElementById('fullName').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    captchaToken
                });

                btn.disabled = false;
                btn.innerHTML = original;

                if (error) {
                    Captcha.reset();
                    if (/captcha/i.test(error.message)) {
                        show('La verificación de seguridad falló. Inténtalo de nuevo.', 'error');
                    } else if (error.message.includes('already registered')) {
                        show('Ese correo ya está registrado. Inicia sesión.', 'error');
                    } else {
                        show(error.message, 'error');
                    }
                    return;
                }

                // Si la confirmación por correo está activa, no hay sesión todavía
                if (data && data.session) {
                    window.location.href = 'index.html';
                } else {
                    form.reset();
                    show('¡Cuenta creada! Revisa tu correo y confirma tu cuenta para poder ingresar.', 'success');
                }
            });
        });
    </script>
</body>
</html>
