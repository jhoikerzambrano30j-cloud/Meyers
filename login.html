<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1A1A1A">
    <title>Ingresar | Meyer's Inmobiliaria</title>
    <meta name="robots" content="noindex">

    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Meyer's">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app.css">
</head>
<body>

    <a href="index.html" class="auth-back"><i class="fas fa-arrow-left"></i> Volver al inicio</a>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="img/logo-meyer.png" alt="Meyer's Inmobiliaria">
            </div>
            <h1>Bienvenido de nuevo</h1>
            <p class="auth-sub">Ingresa a tu cuenta Meyer's</p>

            <div class="alert" id="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="tu@correo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <div class="captcha-box" id="captchaBox"></div>
                <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
            </form>

            <p class="auth-foot">
                ¿No tienes cuenta? <a href="registro.html">Crear cuenta</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="auth.js"></script>
    <script src="captcha.js"></script>
    <script>
        const alertBox = document.getElementById('alert');
        const show = (msg, tipo) => {
            alertBox.textContent = msg;
            alertBox.className = 'alert show ' + (tipo === 'error' ? 'alert-error' : 'alert-success');
        };

        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.isSupabaseReady()) {
                show('Supabase aún no está configurado. Pega tus claves en config.js.', 'error');
            }

            // Mostrar / ocultar la contraseña
            if (window.Auth && Auth.addPasswordToggle) {
                Auth.addPasswordToggle('password');
            }

            if (new URLSearchParams(location.search).get('expirado')) {
                show('Tu sesión se cerró por inactividad. Vuelve a ingresar.', 'error');
            }

            // Si ya hay sesión, redirige
            const user = await Auth.getUser();
            if (user) {
                const admin = await Auth.isAdmin();
                window.location.href = admin ? 'admin.html' : 'index.html';
                return;
            }

            // Captcha anti-robots (solo aparece si Cloudflare lo pide)
            if (window.Captcha) Captcha.render('#captchaBox');

            const form = document.getElementById('loginForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const btn = form.querySelector('button[type="submit"]');
                const original = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';

                // Verificación anti-robots (Cloudflare Turnstile)
                const captchaToken = await Captcha.waitForToken(10000);
                if (Captcha.activo && !captchaToken) {
                    btn.disabled = false;
                    btn.innerHTML = original;
                    show('No pudimos verificar que no eres un robot. Inténtalo de nuevo.', 'error');
                    Captcha.reset();
                    return;
                }

                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Ingresando...';

                const { error } = await Auth.signIn(
                    document.getElementById('email').value.trim(),
                    document.getElementById('password').value,
                    captchaToken
                );

                if (error) {
                    btn.disabled = false;
                    btn.innerHTML = original;
                    Captcha.reset();
                    const esBloqueo = /banned|blocked|bloquead/i.test(error.message);
                    show(esBloqueo
                        ? 'Tu cuenta está bloqueada. Contacta al administrador.'
                        : error.message === 'Invalid login credentials'
                            ? 'Correo o contraseña incorrectos.'
                            : /captcha/i.test(error.message)
                                ? 'La verificación de seguridad falló. Inténtalo de nuevo.'
                                : error.message, 'error');
                    return;
                }

                const perfil = await Auth.getProfile();
                if (perfil && perfil.bloqueado) {
                    await window.db.auth.signOut();
                    btn.disabled = false;
                    btn.innerHTML = original;
                    show('Tu cuenta está bloqueada. Contacta al administrador.', 'error');
                    return;
                }

                const admin = await Auth.isAdmin();
                window.location.href = admin ? 'admin.html' : 'index.html';
            });
        });
    </script>
</body>
</html>
